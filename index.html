<style>
  :root {
    --fondo: #0b1020;
    --acento: #6366f1;
    --acento2: #c084fc;
    --verde: #22c55e;
    --rojo: #ef4444;
    --ambar: #f59e0b;
    --texto: #f1f5f9;
    --texto-suave: #94a3b8;
    --vidrio: rgba(255,255,255,0.05);
    --borde: rgba(255,255,255,0.09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.32;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 { width: 480px; height: 480px; background: #4f46e5; top: -140px; left: -120px; animation: flotar1 22s ease-in-out infinite alternate; }
  .blob-2 { width: 420px; height: 420px; background: #a855f7; bottom: -150px; right: -110px; animation: flotar2 26s ease-in-out infinite alternate; }
  @keyframes flotar1 { from { transform: translate(0,0) scale(1); } to { transform: translate(120px, 80px) scale(1.15); } }
  @keyframes flotar2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-100px, -70px) scale(0.95); } }

  .tarjeta {
    position: relative;
    z-index: 1;
    background: var(--vidrio);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--borde);
    border-radius: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    width: 100%;
    max-width: 940px;
    padding: 44px;
    text-align: center;
    animation: entrada 0.45s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes entrada { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }

  h1 {
    font-size: clamp(2.3rem, 5.5vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  .titulo-logo h1 span {
    display: inline-block;
    background: linear-gradient(92deg, #a5b4fc, var(--acento2), #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: ola 2.6s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.13s);
  }
  @keyframes ola {
    0%, 100% { transform: translateY(7px); }
    50% { transform: translateY(-7px); }
  }
  .subtitulo { color: var(--texto-suave); font-size: 1.15rem; margin-bottom: 36px; }
  .titulo-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .logo {
    width: clamp(58px, 9vw, 84px);
    height: auto;
    filter: drop-shadow(0 10px 28px rgba(139,92,246,0.5));
    animation: flotar-logo 4.5s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes flotar-logo {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-7px) rotate(2deg); }
  }
  .brillo-linea {
    height: 3px; width: 130px; margin: 0 auto 14px; border-radius: 99px;
    background: linear-gradient(90deg, transparent, var(--acento), var(--acento2), transparent);
  }

  .lobby-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    text-align: left;
  }
  .tarjeta-quiz {
    position: relative;
    background: rgba(255,255,255,0.045);
    border: 1.5px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    padding: 26px 24px;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(.2,.8,.3,1), border-color 0.2s, background 0.2s, box-shadow 0.25s;
    color: var(--texto);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 11px;
    align-items: flex-start;
    overflow: hidden;
  }
  .tarjeta-quiz::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(420px 180px at var(--mx,50%) -20%, var(--glow, rgba(99,102,241,0.25)), transparent 65%);
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }
  .tarjeta-quiz:hover { transform: translateY(-6px); border-color: var(--color-tarjeta); background: rgba(255,255,255,0.07); box-shadow: 0 18px 44px rgba(0,0,0,0.5); }
  .tarjeta-quiz:hover::before { opacity: 1; }
  .badge {
    font-size: 0.74rem; font-weight: 700; letter-spacing: 1.4px;
    color: #fff; background: var(--color-tarjeta);
    border-radius: 8px; padding: 5px 12px;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--color-tarjeta) 45%, transparent);
  }
  .tarjeta-quiz h3 { font-size: 1.28rem; font-weight: 700; }
  .tarjeta-quiz p { color: var(--texto-suave); font-size: 0.94rem; line-height: 1.5; flex-grow: 1; }
  .num-preguntas { font-size: 0.84rem; font-weight: 600; color: var(--texto-suave); display: flex; align-items: center; gap: 8px; }
  .punto-color { width: 8px; height: 8px; border-radius: 50%; background: var(--color-tarjeta); box-shadow: 0 0 10px var(--color-tarjeta); }

  .boton {
    background: linear-gradient(92deg, var(--acento), var(--acento2));
    color: white; border: none; border-radius: 14px;
    font-size: 1.12rem; font-weight: 700;
    padding: 15px 46px; cursor: pointer;
    transition: transform 0.16s, box-shadow 0.16s, filter 0.16s;
    box-shadow: 0 10px 28px rgba(99,102,241,0.35);
  }
  .boton:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 14px 34px rgba(139,92,246,0.45); }
  .boton:active { transform: translateY(0); }
  .boton-secundario { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); box-shadow: none; }
  .boton-secundario:hover { background: rgba(255,255,255,0.13); box-shadow: none; }
  .zona-botones-final { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .cabecera-quiz { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tema-actual {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 1.4px; color: #fff;
    background: linear-gradient(92deg, var(--acento), var(--acento2));
    border-radius: 999px; padding: 6px 14px;
  }
  .fila-info { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    padding: 6px 16px; border-radius: 999px;
    font-weight: 700; font-size: 0.95rem;
  }
  .chip-puntos { color: #a5b4fc; }
  #reloj { font-variant-numeric: tabular-nums; }
  @keyframes pulso { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .barra-progreso { height: 9px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
  #relleno { height: 100%; width: 0%; background: linear-gradient(90deg, var(--acento), var(--acento2)); border-radius: 999px; transition: width 0.45s cubic-bezier(.2,.8,.3,1); }
  .barra-tiempo { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-bottom: 26px; }
  #tiempo-relleno {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--verde), #a3e635);
    border-radius: 999px;
    transition: width 0.12s linear, background 0.4s;
  }
  .pregunta { font-size: clamp(1.22rem, 2.7vw, 1.68rem); font-weight: 650; margin-bottom: 28px; line-height: 1.42; min-height: 66px; }
  .opciones { display: grid; gap: 13px; }
  .opcion {
    background: rgba(255,255,255,0.045);
    border: 1.5px solid rgba(255,255,255,0.11);
    border-radius: 15px;
    color: var(--texto);
    font-size: 1.07rem;
    text-align: left;
    padding: 17px 20px;
    cursor: pointer;
    transition: all 0.16s;
    display: flex; gap: 14px; align-items: center;
    width: 100%;
    font-family: inherit;
  }
  .opcion:hover:not(:disabled) { border-color: var(--acento); background: rgba(99,102,241,0.13); transform: translateX(6px); }
  .opcion:disabled { cursor: default; opacity: 0.85; }
  .letra {
    background: rgba(255,255,255,0.09);
    border-radius: 9px;
    min-width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.9rem; flex-shrink: 0;
    transition: background 0.2s;
  }
  .correcta { border-color: var(--verde) !important; background: rgba(34,197,94,0.16) !important; }
  .correcta .letra { background: var(--verde); color: #052e16; }
  .incorrecta { border-color: var(--rojo) !important; background: rgba(239,68,68,0.15) !important; animation: temblor 0.35s; }
  .incorrecta .letra { background: var(--rojo); color: #450a0a; }
  @keyframes temblor { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  #zona-resultado { display: none; margin-top: 24px; text-align: left; animation: aparecer 0.3s ease; }
  #etiqueta-resultado { font-weight: 800; font-size: 1.02rem; margin-bottom: 8px; letter-spacing: 0.3px; }
  #etiqueta-resultado.bien { color: var(--verde); }
  #etiqueta-resultado.mal { color: var(--rojo); }
  #etiqueta-resultado.tiempo { color: var(--ambar); }
  #explicacion {
    background: rgba(255,255,255,0.05);
    border-left: 3px solid var(--acento);
    border-radius: 0 12px 12px 0;
    padding: 15px 19px;
    color: var(--texto-suave);
    line-height: 1.55;
    font-size: 0.98rem;
  }
  @keyframes aparecer { from {opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  #zona-siguiente { display: none; margin-top: 24px; }

  .puntaje-final { font-size: clamp(3.4rem, 8vw, 5.2rem); font-weight: 900; line-height: 1.1; background: linear-gradient(92deg, #a5b4fc, var(--acento2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mensaje-final { font-size: 1.35rem; margin: 12px 0 22px; font-weight: 650; }
  .stats-finales { display: flex; justify-content: center; gap: 14px; margin-bottom: 34px; flex-wrap: wrap; }
  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 16px 26px;
    min-width: 118px;
  }
  .stat b { display: block; font-size: 1.6rem; }
  .stat span { color: var(--texto-suave); font-size: 0.84rem; font-weight: 600; }
  .stat-verde b { color: var(--verde); } .stat-rojo b { color: var(--rojo); } .stat-ambar b { color: var(--ambar); }
  .detalle-final { color: var(--texto-suave); margin-bottom: 30px; font-size: 1rem; }
  .ranking-final { max-width: 500px; margin: 0 auto 28px; text-align: left; }
  .ranking-final h3 {
    font-size: 0.78rem; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--texto-suave); text-align: center; margin-bottom: 14px;
  }
  .fila-rank {
    display: flex; align-items: center; gap: 13px;
    padding: 11px 15px; margin-bottom: 8px;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.93rem;
  }
  .fila-rank .pos {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.85rem;
    background: rgba(255,255,255,0.08); color: var(--texto-suave);
  }
  .fila-rank.top1 .pos { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #451a03; box-shadow: 0 4px 14px rgba(245,158,11,0.35); }
  .fila-rank.top2 .pos { background: linear-gradient(135deg,#e2e8f0,#94a3b8); color: #1e293b; }
  .fila-rank.top3 .pos { background: linear-gradient(135deg,#fdba74,#ea580c); color: #431407; }
  .fila-rank .info-rank { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-rank .info-rank b { color: #a5b4fc; }
  .chip-nueva {
    flex-shrink: 0;
    font-size: 0.66rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 99px;
    background: var(--acento); color: #fff;
  }
  .fila-rank.actual { border-color: rgba(99,102,241,0.55); background: rgba(99,102,241,0.12); }
  .posicion-actual { text-align: center; color: var(--texto-suave); font-size: 0.85rem; margin-top: 12px; }
  .stats-globales { text-align: center; color: var(--texto-suave); font-size: 0.92rem; margin-top: 22px; letter-spacing: 0.3px; }
  .stats-globales b { color: var(--texto); }
  .oculto { display: none !important; }

  .contenedor-pagina {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 940px;
    margin: auto;
    display: flex;
    flex-direction: column;
  }
  .btn-atras {
    align-self: flex-start;
    margin-bottom: 16px;
    width: 54px; height: 54px;
    border-radius: 17px;
    background: var(--vidrio);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--texto);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s, border-color 0.2s;
  }
  .btn-atras:hover { transform: translateX(-4px); background: rgba(255,255,255,0.11); border-color: var(--acento); }
  .btn-atras svg { width: 24px; height: 24px; }

  .btn-mute {
    position: fixed;
    top: 24px; right: 24px;
    z-index: 30;
    width: 54px; height: 54px;
    border-radius: 17px;
    background: var(--vidrio);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--texto-suave);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s, border-color 0.2s, color 0.2s;
  }
  .btn-mute:hover { transform: translateY(-3px) scale(1.05); background: rgba(255,255,255,0.11); border-color: var(--acento); color: var(--texto); }
  .btn-mute:active { transform: scale(0.88); transition-duration: 0.09s; }
  .btn-mute svg { width: 24px; height: 24px; }
  .btn-mute.apagado { color: var(--rojo); }

  .boton, .opcion, .btn-atras { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }

  .boton, .opcion, .tarjeta-quiz, .btn-atras { will-change: transform; }
  .boton:active { transform: scale(0.94); filter: brightness(1.2); transition-duration: 0.09s; }
  .opcion:active:not(:disabled) { transform: scale(0.965); transition-duration: 0.09s; }
  .tarjeta-quiz:active { transform: scale(0.965); transition-duration: 0.09s; }
  .btn-atras:active { transform: scale(0.88); transition-duration: 0.09s; }

  .onda {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 42%, rgba(255,255,255,0) 70%);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    mix-blend-mode: screen;
    animation: expandir-onda 0.7s cubic-bezier(.2,.6,.35,1) forwards;
  }
  @keyframes expandir-onda {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    70% { opacity: 0.55; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  #particulas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .vineta {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(3,7,18,0.6) 100%);
  }
  ::selection { background: rgba(139,92,246,0.55); color: #fff; }
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-track { background: var(--fondo); }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--acento), var(--acento2)); border-radius: 99px; border: 2px solid var(--fondo); }

  .tarjeta-quiz { animation: entrada 0.55s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--d) * 80ms); }
  .card-icon { width: 32px; height: 32px; flex-shrink: 0; opacity: 0.95; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.35)); }
  .fila-icono { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .mejor-puntaje {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.4px;
    color: #86efac; background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.35);
    border-radius: 999px; padding: 4px 11px;
  }

  .cabecera-categoria { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; text-align: left; }
  .cat-icono-box {
    width: 66px; height: 66px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.18);
    flex-shrink: 0;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
  }
  .cat-icono-box svg { width: 34px; height: 34px; }
  #pantalla-categoria h2 {
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(92deg, #a5b4fc, var(--acento2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitulo-cat { color: var(--texto-suave); font-size: 0.95rem; margin-top: 5px; line-height: 1.45; }
  .icono-categoria {
    width: 46px; height: 46px; border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icono-categoria svg { width: 26px; height: 26px; }

  .reloj-circular {
    position: relative;
    width: 76px; height: 76px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .reloj-circular svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .anillo-fondo { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 5.5; }
  #anillo {
    fill: none; stroke: var(--verde); stroke-width: 5.5;
    stroke-linecap: round;
    stroke-dasharray: 163.36; stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.12s linear, stroke 0.4s;
    filter: drop-shadow(0 0 6px currentColor);
  }
  .tiempo-num {
    font-size: 1.28rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: color 0.35s;
    color: #86efac;
  }
  .reloj-circular.medio .tiempo-num { color: #fcd34d; }
  .reloj-circular.critico .tiempo-num { color: #fca5a5; animation: pulso 0.8s ease infinite; }
  .reloj-circular.medio #anillo { stroke: var(--ambar); }
  .reloj-circular.critico #anillo { stroke: var(--rojo); }

  .dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 20px; flex-wrap: wrap; }  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.13);
    transition: all 0.3s;
  }
  .dot.actual {
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15), 0 0 12px rgba(255,255,255,0.4);
    transform: scale(1.25);
  }
  .dot.ok { background: var(--verde); box-shadow: 0 0 8px rgba(34,197,94,0.6); }
  .dot.mal { background: var(--rojo); box-shadow: 0 0 8px rgba(239,68,68,0.6); }
  .dot.to { background: var(--ambar); box-shadow: 0 0 8px rgba(245,158,11,0.6); }

  .racha {
    display: none;
    align-items: center; gap: 7px;
    background: linear-gradient(92deg, #f59e0b33, #ef444433);
    border: 1px solid rgba(245,158,11,0.5);
    color: #fcd34d;

function audioCtx() {
  if (!ctxAudio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctxAudio = new AC();
  }
  if (ctxAudio.state === "suspended") ctxAudio.resume();
  return ctxAudio;
}

function tono(freq, inicio, dur, tipo, vol, freqFin) {
  const ctx = audioCtx();
  if (!ctx || silencio) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const t0 = ctx.currentTime + inicio;
  osc.type = tipo || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if (freqFin) osc.frequency.exponentialRampToValueAtTime(freqFin, t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

  try { return localStorage.getItem("cyberquiz_best_" + id); } catch (e) { return null; }
}

function guardarMejor(id, pct) {
  try {
    const previo = parseInt(mejorPuntaje(id) || "0", 10);
    if (pct > previo) localStorage.setItem("cyberquiz_best_" + id, String(pct));
  } catch (e) {}

function mezclar(arr) {
  const copia = [...arr];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

  quizActual = {
    ...origen,
    preguntas: mezclar(origen.preguntas).map(p => {
      const orden = mezclar([0, 1, 2, 3]);
      return { q: p.q, ops: orden.map(i => p.ops[i]), ok: orden.indexOf(p.ok), exp: p.exp };
    })
  };
  actual = 0; puntos = 0; aciertos = 0; fallos = 0; agotados = 0; racha = 0;

function iniciarTimer() {
  detenerTimer();
  tiempoRestante = TIEMPO_PREGUNTA;
  pintarTimer();
  intervaloTimer = setInterval(() => {
    tiempoRestante -= 0.1;
    if (tiempoRestante <= 0) {
      tiempoRestante = 0;
      pintarTimer();
      detenerTimer();
      expirar();
    } else {
      pintarTimer();
    }
  }, 100);
}

function detenerTimer() {
  if (intervaloTimer) {
    clearInterval(intervaloTimer);
    intervaloTimer = null;
  }
}

function pintarTimer() {
  const pct = Math.max(0, tiempoRestante / TIEMPO_PREGUNTA);
  $tiempoNum.textContent = Math.ceil(tiempoRestante);
  $anillo.style.strokeDashoffset = String(LONGITUD_ANILLO * (1 - pct));
  $reloj.classList.remove("medio", "critico");
  if (pct <= 0.2) {
    $reloj.classList.add("critico");
  } else if (pct <= 0.5) {
    $reloj.classList.add("medio");
  }
}

function revelarRespuesta(correctaIdx) {
  const botones = document.querySelectorAll(".opcion");
  botones.forEach(b => b.disabled = true);
  if (correctaIdx !== null) botones[correctaIdx].classList.add("correcta");
}

function mostrarExplicacion(tipo, textoExtra) {
  const etiqueta = document.getElementById("etiqueta-resultado");
  etiqueta.className = "";
  etiqueta.classList.add(tipo);
  etiqueta.textContent = textoExtra;
  const exp = document.getElementById("explicacion");
  exp.textContent = quizActual.preguntas[actual].exp;
  document.getElementById("zona-resultado").style.display = "block";
}

function responder(i, btn) {
  if (respondido) return;
  respondido = true;
  detenerTimer();
  const p = quizActual.preguntas[actual];

  if (i === p.ok) {
    puntos += 10 + racha * 2;
    aciertos++;
    racha++;
    btn.classList.add("correcta");
    revelarRespuesta(null);
    mostrarExplicacion("bien", racha >= 3 ? `¡Correcto! Racha de ${racha} · +${10 + (racha - 1) * 2} pts` : "¡Correcto! +10 pts");
    sonidos.acierto(racha);
    actualizarDotActual("ok");
  } else {
    fallos++;
    racha = 0;
    btn.classList.add("incorrecta");
    revelarRespuesta(p.ok);
    mostrarExplicacion("mal", "Incorrecto.");
    sonidos.fallo();
    actualizarDotActual("mal");
  }

  document.getElementById("puntos").textContent = `${puntos} pts`;
  pintarRacha();
  prepararBotonSiguiente();
}

function pintarRacha() {
  const chip = document.getElementById("racha");
  if (racha >= 2) {
    document.getElementById("num-racha").textContent = racha;
    chip.classList.remove("visible");
    void chip.offsetWidth;
    chip.classList.add("visible");
  } else {
    chip.classList.remove("visible");
  }
}

function expirar() {
  if (respondido) return;
  respondido = true;
  agotados++;
  racha = 0;
  revelarRespuesta(quizActual.preguntas[actual].ok);
  mostrarExplicacion("tiempo", "¡Tiempo agotado!");
  sonidos.tiempoAgotado();
  actualizarDotActual("to");
  prepararBotonSiguiente(true);
}

function prepararBotonSiguiente(auto) {
  const total = quizActual.preguntas.length;
  const btnSig = document.getElementById("btn-siguiente");
  btnSig.textContent = actual === total - 1 ? "Ver resultados →" : "Siguiente →";
  document.getElementById("zona-siguiente").style.display = "block";
  if (auto) {
    setTimeout(() => {
      if (respondido && !$quiz.classList.contains("oculto")) btnSig.click();
    }, 2200);
  }
}

document.getElementById("btn-siguiente").onclick = () => {
  detenerTimer();
  actual++;
  if (actual < quizActual.preguntas.length) {
    mostrarPregunta();
  } else {
    terminar();
  }
};

function terminar() {
  detenerTimer();
  $quiz.classList.add("oculto");
  reiniciarAnimacion($final);
  const total = quizActual.preguntas.length;
  const pct = Math.round((aciertos / total) * 100);
  let msg;
  if (pct >= 90) msg = "¡Excelente! Nivel experto.";
  else if (pct >= 70) msg = "¡Muy bien! Dominas lo esencial.";
  else if (pct >= 50) msg = "Bien, pero conviene repasar un poco.";
  else msg = "Hay que estudiar más... ¡a por ello!";
  document.getElementById("tema-final").textContent = quizActual.badge + " · " + quizActual.titulo.toUpperCase();
  document.getElementById("puntaje-final").textContent = `${pct}%`;
  document.getElementById("mensaje-final").textContent = msg;
  document.getElementById("stat-ok").textContent = aciertos;
  document.getElementById("stat-mal").textContent = fallos;
  document.getElementById("stat-timeout").textContent = agotados;
  guardarMejor(quizActual.id, pct);
  const previoMejor = mejorPuntaje(quizActual.id) === String(pct) && pct > 0;
  document.getElementById("detalle-final").textContent =
    `Acertaste ${aciertos} de ${total} preguntas · Puntuación: ${puntos} pts` +
    (previoMejor ? " · ¡Nuevo récord!" : "");
  document.getElementById("btn-repetir").onclick = () => iniciarQuiz(quizActual.id);
  if (pct >= 70) lanzarConfeti();
  const registro = {
    id: quizActual.id,
    badge: quizActual.badge,
    pct: pct,
    puntos: puntos,
    ok: aciertos,
    resp: aciertos + fallos + agotados,
    fecha: Date.now()
  };
  guardarEnHistorial(registro);
  pintarRankingFinal(registro);
  setTimeout(() => (pct >= 70 ? sonidos.victoria() : sonidos.derrota()), 350);
}

function pintarRankingFinal(actual) {
  const caja = document.getElementById("ranking-final");
  const lista = cargarHistorial()
    .filter(r => r.id === actual.id)
    .sort((a, b) => b.pct - a.pct || b.puntos - a.puntos || a.fecha - b.fecha);
  const top = lista.slice(0, 3);
  const posicion = lista.findIndex(r => r.fecha === actual.fecha) + 1;
  const fmtFecha = f => {
    const d = new Date(f);
    return d.getDate() + "/" + (d.getMonth() + 1) + "/" + String(d.getFullYear()).slice(2);
  };
  caja.innerHTML =
    "<h3>Tus mejores partidas · " + actual.badge + "</h3>" +
    top.map((r, i) =>
      `<div class="fila-rank top${i + 1}${r.fecha === actual.fecha ? " actual" : ""}">` +
      `<span class="pos">${i + 1}</span>` +
      `<span class="info-rank"><b>${r.pct}%</b> · ${r.puntos} pts · ${fmtFecha(r.fecha)}</span>` +
      (r.fecha === actual.fecha ? '<span class="chip-nueva">Esta partida</span>' : "") +
      "</div>"
    ).join("") +
    `<p class="posicion-actual">Quedaste en el puesto <b>${posicion}</b> de ${lista.length} partida${lista.length !== 1 ? "s" : ""} de este quiz</p>`;
}

function lanzarConfeti() {
  const colores = ["#6366f1", "#c084fc", "#22c55e", "#f59e0b", "#38bdf8", "#f472b6"];
  for (let i = 0; i < 90; i++) {
    const pieza = document.createElement("div");
    pieza.className = "confeti";
    pieza.style.left = Math.random() * 100 + "vw";
    pieza.style.background = colores[Math.floor(Math.random() * colores.length)];
    pieza.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    pieza.style.setProperty("--dur", (2.2 + Math.random() * 1.8) + "s");
    pieza.style.setProperty("--delay", (Math.random() * 0.9) + "s");
    if (Math.random() > 0.5) pieza.style.borderRadius = "50%";
    pieza.addEventListener("animationend", () => pieza.remove());
    document.body.appendChild(pieza);
  }
}

function iniciarParticulas() {
  const canvas = document.getElementById("particulas");
  const ctx = canvas.getContext("2d");
  let particulas = [];
  function redimensionar() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  }
  redimensionar();
  addEventListener("resize", redimensionar);
  for (let i = 0; i < 55; i++) {
    particulas.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.4 + 0.6,
      vy: -(Math.random() * 0.35 + 0.08),
      vx: (Math.random() - 0.5) * 0.18,
      alpha: Math.random() * 0.5 + 0.15,
      color: Math.random() > 0.5 ? "165,180,252" : "192,132,252"
    });
  }
  function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particulas.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.shadowColor = `rgba(${p.color},0.8)`;
      ctx.shadowBlur = 6;
      ctx.fill();
    });
    requestAnimationFrame(animar);
  }
  animar();
}
iniciarParticulas();

document.getElementById("btn-lobby").onclick = abrirLobby;
document.getElementById("btn-atras").onclick = volverAtras;
document.addEventListener("pointerdown", () => audioCtx(), { once: true });

document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".boton, .tarjeta-quiz, .opcion, .btn-atras, .btn-mute");
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const onda = document.createElement("span");
  const tam = Math.max(rect.width, rect.height) * 2.3;
  onda.className = "onda";
  onda.style.width = onda.style.height = tam + "px";
  onda.style.left = (e.clientX - rect.left) + "px";
  onda.style.top = (e.clientY - rect.top) + "px";
  el.appendChild(onda);
  setTimeout(() => onda.remove(), 720);
});

document.addEventListener("keydown", e => {
  if ((e.key === "m" || e.key === "M") && !e.ctrlKey && !e.metaKey && !e.altKey) {
    alternarSonido();
    return;
  }
  if (e.key === "Escape" && $lobby.classList.contains("oculto")) {
    volverAtras();
    return;
  }
  const idx = ["1", "2", "3", "4"].indexOf(e.key);
  if (idx !== -1 && !$quiz.classList.contains("oculto")) {
    const botones = document.querySelectorAll(".opcion");
    if (botones[idx] && !respondido) botones[idx].click();
  }
  if ((e.key === "Enter" || e.key === " ") && !$quiz.classList.contains("oculto") && respondido) {
    e.preventDefault();
    document.getElementById("btn-siguiente").click();
  }
});

document.querySelectorAll(".tarjeta-quiz").forEach(() => {});
document.addEventListener("mousemove", e => {
  document.querySelectorAll(".tarjeta-quiz").forEach(card => {
    const rect = card.getBoundingClientRect();
    card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
  });
});

abrirLobby();
</script>
